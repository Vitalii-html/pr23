<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мої уподобання</title>
  <style>
    body {
      background-color: #007BFF;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .content {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 30px 20px;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-sizing: border-box;
    }

    ul {
      text-align: left;
      padding-left: 20px;
    }

    li {
      margin-bottom: 10px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #ffdd57;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    a:hover {
      color: #ffffff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Мої уподобання</h1>
    <ul>
      <li>Спати</li>
      <li>Дивитися TikTok</li>
      <li>Подорожувати</li>
      <li>Слухати музику</li>
      <li>Грати в настільний теніс</li>
      <li>Дивитися цікаві фільми</li>
      <li>Відпочивати в горах</li>
    </ul>
    <a href="index.html">На головну</a>
  </div>
</body>
</html>
